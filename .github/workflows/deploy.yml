name: Deploy Astro Web to Google Cloud Storage

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      - name: Verify build output has F&O positioning
        run: |
          grep -q "UPGRADE EXPERTS FROM DYNAMICS AX 2012" dist/index.html
          grep -q "Finance & Operations" dist/index.html
          if grep -q "Partner of the Year" dist/index.html; then echo "bad: Partner of the Year"; exit 1; fi
          if grep -q "Inner Circle" dist/index.html; then echo "bad: Inner Circle"; exit 1; fi
          if grep -q "30x Microsoft" dist/index.html; then echo "bad: 30x claim"; exit 1; fi
          echo "Build marker OK"
          head -c 500 dist/index.html

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync build files to Google Cloud Storage
        run: |
          gcloud storage rsync --recursive --delete-unmatched-destination-objects dist/ gs://improved365.com
          # Force homepage + AX page overwrite (rsync has skipped stale index.html before)
          gcloud storage cp dist/index.html gs://improved365.com/index.html \
            --cache-control="no-cache, max-age=0" \
            --content-type="text/html; charset=utf-8"
          gcloud storage cp dist/ax-2012-to-dynamics-365/index.html \
            gs://improved365.com/ax-2012-to-dynamics-365/index.html \
            --cache-control="no-cache, max-age=0" \
            --content-type="text/html; charset=utf-8"

      - name: Verify bucket homepage after upload
        run: |
          gcloud storage cat gs://improved365.com/index.html | grep -q "UPGRADE EXPERTS FROM DYNAMICS AX 2012"
          gcloud storage cat gs://improved365.com/index.html | grep -q "Finance & Operations"
          if gcloud storage cat gs://improved365.com/index.html | grep -q "Partner of the Year"; then
            echo "ERROR: bucket still has Partner of the Year"
            exit 1
          fi
          echo "Bucket homepage verified"

      - name: Set web configuration and caching
        continue-on-error: true
        run: |
          gcloud storage buckets update gs://improved365.com --web-main-page-suffix=index.html --web-error-page=404.html || true
